<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Página não encontrada.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="https://dididoingles.github.io/marsroleplay/favicon.png">
    <link rel="apple-touch-icon" href="https://dididoingles.github.io/marsroleplay/favicon.png">
    <title>404 · Página não encontrada</title>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }
        body {
            background-color: #ffffff;
            font-family: 'Poppins', sans-serif;
            letter-spacing: -0.05em;
            color: #222222;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* AURA RADIAL */
        .aura {
            position: fixed;
            top: 50%; left: 50%;
            width: 100vmax; height: 100vmax;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(194,0,0,0.09) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: auraBreath 9s ease-in-out infinite;
        }
        @keyframes auraBreath {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50%      { transform: translate(-50%, -50%) scale(1.1); }
        }

        /* TOPBAR */
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px;
            position: relative; z-index: 20;
            flex-shrink: 0;
        }
        .logo-title-row { display: flex; align-items: center; gap: 8px; }
        .logo-title {
            font-weight: 700;
            letter-spacing: -0.05em;
            font-size: 22px;
            color: #c20000;
            line-height: 1;
        }
        .logo-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #c20000;
        }

        /* CONTEÚDO PRINCIPAL */
        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 1;
            gap: 24px;
        }

        .content-row {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* BLOCO DO ROBÔ */
        .robot-block {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            order: 1;
        }
        .robot-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .robot-bubble {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%) rotate(-4deg);
            background: #ffffff;
            border: 1.5px solid #222222;
            border-radius: 14px;
            padding: 6px 14px;
            font-family: 'Gochi Hand', cursive;
            font-size: 14px;
            color: #222222;
            letter-spacing: 0.02em;
            box-shadow: 2px 2px 0 rgba(34,34,34,0.15);
            white-space: nowrap;
        }
        .robot-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px; left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 10px; height: 10px;
            background: #ffffff;
            border-right: 1.5px solid #222222;
            border-bottom: 1.5px solid #222222;
        }
        .robot-img {
            width: 160px; height: 160px;
            object-fit: contain;
            filter: drop-shadow(0 16px 32px rgba(194,0,0,0.25));
            animation: robotFloat 4.5s ease-in-out infinite;
        }
        @keyframes robotFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50%      { transform: translateY(-10px) rotate(2deg); }
        }

        /* BLOCO DE TEXTO */
        .text-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            order: 2;
        }
        .error-code {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 84px;
            line-height: 0.9;
            color: #c20000;
            letter-spacing: -0.06em;
            text-shadow: 3px 3px 0 rgba(194,0,0,0.15);
        }
        .error-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 26px;
            line-height: 1.15;
            letter-spacing: -0.04em;
            color: #222222;
            max-width: 420px;
        }
        .error-desc {
            font-family: 'Gochi Hand', cursive;
            font-size: 17px;
            line-height: 1.5;
            letter-spacing: 0.01em;
            color: #555555;
            max-width: 420px;
        }

        /* BOTÃO ÚNICO */
        .actions {
            display: flex;
            justify-content: center;
            margin-top: 8px;
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 44px;
            padding: 0 22px;
            background-color: #c20000;
            color: #ffffff;
            font-family: 'Gochi Hand', cursive;
            font-weight: 400;
            font-size: 16px;
            letter-spacing: 0.02em;
            border: 2px solid #222222;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 2px 3px 0 rgba(34,34,34,0.85);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
        }
        .action-btn:hover {
            background-color: #a30000;
            transform: translateY(1px) translateX(1px);
            box-shadow: 1px 2px 0 rgba(34,34,34,0.85);
        }
        .action-btn:active {
            transform: translateY(3px) translateX(2px);
            box-shadow: 0 0 0 rgba(34,34,34,0.85);
        }
        .action-btn svg {
            width: 16px; height: 16px;
            stroke: #ffffff; stroke-width: 2;
            fill: none; stroke-linecap: round; stroke-linejoin: round;
        }

        /* FOOTER */
        footer {
            width: 100%;
            text-align: center;
            padding: 14px 20px 16px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .footer-text {
            font-weight: 400;
            font-size: 11px;
            color: #666666;
            letter-spacing: -0.03em;
        }
        .footer-link {
            color: #c20000;
            text-decoration: none;
            font-weight: 600;
            position: relative;
            transition: color 0.25s ease;
        }
        .footer-link::after {
            content: '';
            position: absolute;
            left: 0; bottom: -2px;
            width: 100%; height: 1px;
            background-color: currentColor;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
        }
        .footer-link:hover { color: #a30000; }
        .footer-link:hover::after { transform: scaleX(1); transform-origin: left; }

        /* ============================================================
           DESKTOP: 2 COLUNAS, SEM SCROLL
           ============================================================ */
        @media (min-width: 900px) {
            html, body {
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
            }
            body {
                display: flex;
                flex-direction: column;
            }

            .topbar { padding: 22px 60px; }
            .logo-title { font-size: 30px; }
            .logo-dot { width: 10px; height: 10px; }

            .stage {
                padding: 20px 60px;
                gap: 0;
            }
            .content-row {
                flex-direction: row;
                justify-content: center;
                align-items: center;
                gap: 80px;
                max-width: 1100px;
            }
            .robot-block { order: 2; }
            .text-block {
                order: 1;
                align-items: flex-start;
                text-align: left;
                gap: 20px;
            }
            .error-code { font-size: 140px; }
            .error-title { font-size: 38px; max-width: 500px; }
            .error-desc { font-size: 22px; max-width: 480px; }
            .actions { justify-content: flex-start; margin-top: 12px; }

            .robot-img { width: 280px; height: 280px; }
            .robot-bubble { font-size: 18px; padding: 8px 18px; top: -14px; }
            .robot-bubble::after { width: 12px; height: 12px; bottom: -7px; }

            footer { padding: 10px 60px 22px; }
            .footer-text { font-size: 13px; }
        }

        /* ============================================================
           TABLET / MOBILE
           ============================================================ */
        @media (max-width: 899px) {
            .error-code { font-size: 72px; }
            .error-title { font-size: 22px; max-width: 340px; }
            .error-desc { font-size: 16px; max-width: 340px; }
            .robot-img { width: 140px; height: 140px; }
            .robot-bubble { font-size: 13px; padding: 5px 12px; top: -6px; }
            .action-btn { font-size: 15px; height: 42px; padding: 0 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .aura, .robot-img { animation: none !important; }
        }
    </style>
</head>
<body>

<div class="aura" aria-hidden="true"></div>

<div class="topbar">
    <div class="logo-title-row">
        <span class="logo-title">Prof.a Diandra</span>
        <span class="logo-dot" aria-hidden="true"></span>
        <span class="logo-title">us.digital</span>
    </div>
</div>

<main class="stage">
    <div class="content-row">

        <div class="robot-block">
            <div class="robot-wrap">
                <div class="robot-bubble">Opa! Erro 404</div>
                <img
                    src="https://dididoingles.github.io/marsroleplay/assets/mars.png"
                    alt="Mars, o robô"
                    class="robot-img"
                    onerror="this.style.display='none'"
                >
            </div>
        </div>

        <div class="text-block">
            <div class="error-code">404</div>
            <h1 class="error-title">Essa página não existe.</h1>
            <p class="error-desc">
                Parece que você se perdeu no caminho. O link que você tentou abrir não foi encontrado.
            </p>
            <div class="actions">
                <a href="https://dididoingles.github.io/estudeconosco/" class="action-btn">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Acesse o site oficial
                </a>
            </div>
        </div>

    </div>
</main>

<footer>
    <p class="footer-text">
        Feito pela professora &middot;
        <a href="https://www.instagram.com/dicarvalho.prof/" target="_blank" rel="noopener noreferrer" class="footer-link">@dicarvalho.prof</a>
    </p>
</footer>

</body>
</html>
